  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />

    <title>Prom Fever | Team</title>
    <style>
      :root { --bg: #fff7f5; --ink: #1f0d14; --muted: #6b5560; --line: #ecd5d8; --brand: #cf2748; --card: #ffffff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b0608; --ink: #fbeff1; --muted: #b9a3aa; --line: #2c1a20; --brand: #f4516c; --card: #150c10; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      form { width: min(100%, 400px); padding: 36px 32px; background: var(--card); border: 1px solid var(--line); }
      img { display: block; height: 64px; width: auto; margin-bottom: 28px; }
      h1 { margin: 0; font: 500 28px/1.1 'Bodoni Moda', Didot, 'Bodoni 72', Georgia, serif; letter-spacing: -0.02em; }
      p { margin: 10px 0 0; color: var(--muted); }
      label { display: block; margin-top: 26px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
      input { width: 100%; height: 48px; margin-top: 8px; padding: 0 14px; font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 0; }
      input:focus-visible, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
      button { width: 100%; height: 48px; margin-top: 16px; font: inherit; font-weight: 600; color: #fff; background: var(--brand); border: 0; border-radius: 999px; cursor: pointer; transition: transform 160ms ease-out; }
      button:active { transform: scale(0.98); }
      button:disabled { opacity: 0.6; cursor: progress; }
      #error { min-height: 24px; margin-top: 14px; color: var(--brand); font-weight: 600; }
    </style>

        error.textContent = '';
        go.disabled = true;
        go.textContent = 'Opening';
        try {
          const material = await crypto.subtle.importKey(
            'raw',
            new TextEncoder().encode(document.getElementById('password').value),
            'PBKDF2',
            false,
            ['deriveKey'],
          );
          const key = await crypto.subtle.deriveKey(

            { name: 'AES-GCM', length: 256 },
            false,
            ['decrypt'],
          );
          const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(LOCKED.iv) }, key, bytes(LOCKED.data));
          const html = new TextDecoder().decode(plain);
          document.open();
          document.write(html);
          document.close();

          // A wrong password fails the integrity check; nothing is revealed.
          error.textContent = 'That password did not open it. Check it and try again.';
          go.disabled = false;
          go.textContent = 'Open inventory';
